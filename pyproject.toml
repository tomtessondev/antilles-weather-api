[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-api"
version = "0.1.0"
description = "A public, key-protected REST API over the Antilles weather and air-quality marts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "respx>=0.22", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
weather-api = "weather_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=weather_api --cov-report=term-missing:skip-covered"
# Starlette asks for httpx2 in its test client; httpx is what FastAPI documents today.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
