name: Daily load

# The batch project exports its marts at 10:00 UTC; load them an hour later.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency: load

jobs:
  load:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c requirements.lock -e .
      - name: Load marts.json into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: weather-api load
